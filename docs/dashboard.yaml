                    {% else %} rgba(76, 175, 80, 0.4)
                    {% endif %};
                }
            visibility:
              - condition: numeric_state
                entity: sensor.YOUR_CAT_1_tage_bis_flohbehandlung
                above: -100000
          - type: heading
            heading: Arztbesuch
            heading_style: subtitle
            icon: mdi:stethoscope
          - type: tile
            entity: date.YOUR_CAT_1_letzter_arztbesuch
            name: Zuletzt
            grid_options:
              columns: 6
          - type: tile
            entity: number.YOUR_CAT_1_intervall_arztbesuch_monate
            name: Intervall
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.YOUR_CAT_1_nachster_arztbesuch
            name: Fällig am
