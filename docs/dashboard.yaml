views:
  - title: Flappie
    icon: mdi:cat
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Steuerung
            icon: mdi:door-sliding
          - type: tile
            entity: lock.YOUR_DEVICE
            name: Klappe
            features:
              - type: lock-commands
            grid_options:
              columns: full
          - type: tile
            entity: select.YOUR_DEVICE_turmodus
            name: Türmodus
            features:
              - type: select-options
            grid_options:
              columns: full
          - type: tile
            entity: switch.YOUR_DEVICE_beuteerkennung
            name: Beuteerkennung
            grid_options:
              columns: full
          - type: tile
            entity: switch.YOUR_DEVICE_beute_zeitsperre
            name: Beute-Zeitsperre
            grid_options:
              columns: full
          - type: tile
            entity: number.YOUR_DEVICE_dauer_beutesperre
            name: Dauer Beutesperre
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: full
          - type: heading
            heading: Status
            icon: mdi:information-outline
          - type: tile
            entity: sensor.YOUR_DEVICE_turstatus
            name: Türstatus
            grid_options:
              columns: full
          - type: tile
            entity: sensor.YOUR_DEVICE_letztes_ereignis
            name: Letztes Ereignis
            grid_options:
              columns: full
          - type: tile
            entity: sensor.YOUR_DEVICE_letztes_beute_ereignis
            name: Letztes Beute-Ereignis
            color: red
            grid_options:
              columns: full
          - type: tile
            entity: sensor.YOUR_DEVICE_blockierte_beute
            name: Blockierte Beute
            grid_options:
              columns: full
          - type: tile
            entity: binary_sensor.YOUR_DEVICE_beutesperre_aktiv
            name: Beutesperre aktiv
            grid_options:
              columns: full
          - type: tile
            entity: binary_sensor.YOUR_DEVICE_zeitplan_aktiv
            name: Zeitplan aktiv
            grid_options:
              columns: full
          - type: heading
            heading: Statistiken
            icon: mdi:chart-bar
          - type: tile
            entity: sensor.YOUR_DEVICE_ereignisse_heute
            name: Ereignisse heute
            grid_options:
              columns: full
          - type: tile
            entity: sensor.YOUR_DEVICE_beute_heute
            name: Beute heute
            grid_options:
              columns: full
          - type: statistics-graph
            title: Aktivität pro Tag
            chart_type: bar
            period: day
            days_to_show: 14
            hide_legend: true
            stat_types:
              - change
            entities:
              - flappie:activity_daily
            grid_options:
              columns: full
          - type: statistics-graph
            title: Beute pro Tag
            chart_type: bar
            period: day
            days_to_show: 60
            hide_legend: true
            stat_types:
              - change
            entities:
              - flappie:prey_daily
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Letzte Ereignisse
            icon: mdi:motion-play-outline
          - type: button
            name: Videos ansehen
            icon: mdi:play-circle-outline
            tap_action:
              action: navigate
              navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fflappie
            grid_options:
              columns: full
          - type: picture-entity
            entity: image.YOUR_DEVICE_ereignis_1
            show_name: false
            show_state: true
          - type: picture-entity
            entity: image.YOUR_DEVICE_ereignis_2
            show_name: false
            show_state: true
          - type: picture-entity
            entity: image.YOUR_DEVICE_ereignis_3
            show_name: false
            show_state: true
          - type: picture-entity
            entity: image.YOUR_DEVICE_ereignis_4
            show_name: false
            show_state: true
      - type: grid
        cards:
          - type: heading
            heading: Behandlungs-Optionen
            heading_style: subtitle
            icon: mdi:tune
          - type: tile
            entity: switch.YOUR_DEVICE_treatments_link_cats
            name: Katzen koppeln
            grid_options:
              columns: 6
          - type: tile
            entity: switch.YOUR_DEVICE_treatments_combo_product_worms_fleas
            name: Kombipräparat
            grid_options:
              columns: 6
          - type: heading
            heading: Cat 1
            icon: mdi:cat
          - type: tile
            entity: sensor.YOUR_CAT_1_gewicht
            name: Gewicht
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.YOUR_CAT_1_alter
            name: Alter
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.YOUR_CAT_1_geburtstag
            name: Geburtstag
            grid_options:
              columns: full
          - type: heading
            heading: Wurmkur
            heading_style: subtitle
            icon: mdi:pill
          - type: tile
            entity: date.YOUR_CAT_1_letzte_wurmkur
            name: Zuletzt
            grid_options:
              columns: 6
          - type: tile
            entity: number.YOUR_CAT_1_intervall_wurmkur_monate
            name: Intervall
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.YOUR_CAT_1_nachste_wurmkur
            name: Fällig am
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  {% set d = states('sensor.YOUR_CAT_1_tage_bis_wurmkur') | int(9999) %}
                  background-color:
                    {% if d < 0 %} rgba(244, 67, 54, 0.4)
                    {% elif d < 15 %} rgba(255, 152, 0, 0.4)
                    {% else %} rgba(76, 175, 80, 0.4)
                    {% endif %};
                }
            visibility:
              - condition: numeric_state
                entity: sensor.YOUR_CAT_1_tage_bis_wurmkur
                above: -100000
          - type: heading
            heading: Flohbehandlung
            heading_style: subtitle
            icon: mdi:bug-outline
          - type: tile
            entity: date.YOUR_CAT_1_letzte_flohbehandlung
            name: Zuletzt
            grid_options:
              columns: 6
          - type: tile
            entity: number.YOUR_CAT_1_intervall_flohbehandlung_monate
            name: Intervall
